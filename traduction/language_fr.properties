BlockDescriptionGlowStone=Une pierre qui brille dans le noir et vous soigne
BlockDescriptionTorchBlock=Éclaire les zones sombres
BlockDescriptionSpiderwebBlock=Ralentit les déplacements
BlockDescriptionWireBlock=Transporte le courant entre les mécanismes en perdant de la force à chaque bloc. Utilisez un répéteur pour aller plus loin
BlockDescriptionLeverBlock=Un interrupteur. Interagissez pour allumer ou couper le courant, il reste dans la position choisie
BlockDescriptionButtonBlock=Interagissez pour envoyer une courte impulsion, puis il se relâche tout seul
BlockDescriptionPressurePlateBlock=Se fixe au sol, au mur ou au plafond et envoie du courant tant que quelque chose appuie dessus. On peut la contourner
BlockDescriptionSensorBlock=Envoie du courant tant que quoi que ce soit se trouve à l'intérieur, quelle que soit la direction. Détecte ce qu'une plaque de pression ne voit pas
BlockDescriptionLampBlock=S'allume tant qu'elle reçoit du courant
BlockDescriptionRepeaterBlock=Transmet le courant dans un seul sens, remis à pleine puissance après un court délai. Interagissez pour le tourner
BlockDescriptionInverterBlock=Envoie du courant uniquement quand son entrée est coupée. À combiner avec des fils pour construire des portes logiques. Interagissez pour le tourner
BlockDescriptionGateBlock=Une porte qui bloque le passage jusqu'à ce qu'elle reçoive du courant. Idéale pour des ponts-levis et des sas
BlockDescriptionTimerBlock=Allume et coupe son courant en boucle, pour alimenter un circuit sans rien pour le déclencher. Interagissez pour changer la vitesse ou l'arrêter
BlockDescriptionToggleBlock=Il se souvient. Chaque fois que le courant arrive par l'arrière, il allume ou coupe le courant à l'avant et le laisse ainsi : un bouton peut donc garder une porte ouverte. Interagissez pour le tourner
BlockDescriptionObserverBlock=Envoie une courte impulsion dès que le bloc derrière lui change, qu'il soit posé, cassé ou activé. Interagissez pour le tourner
BlockDescriptionLightSensorBlock=Envoie du courant tant qu'il fait jour à son emplacement. Interagissez pour le retourner : il enverra alors du courant dans le noir
BlockDescriptionNoteBlock=Joue une note dès qu'il reçoit du courant. Interagissez pour l'accorder, et reliez-en une rangée à un minuteur pour faire de la musique
BlockDescriptionDispenserBlock=Éjecte par sa face ce qu'on y a chargé quand il reçoit du courant : pose des blocs, tire des armes et des munitions au nom de celui qui l'a posé, et lâche tout le reste. Interagissez pour le charger, et cochez la case pour lâcher un bloc chargé au lieu de construire avec. Il est orienté dans la direction où vous visiez en le posant
BlockDescriptionConveyorBlock=Transporte tout ce qui se trouve dessus, joueurs et objets lâchés, sans jamais avoir besoin de courant. Posez-en un à côté d'un autre et il rejoint automatiquement la ligne, diagonales comprises ; interagissez pour le tourner à la main. Les lignes montantes font monter les choses, et une ligne qui se termine sur un coffre, une trémie ou un distributeur les y charge
BlockDescriptionHopperBlock=Déplace les objets tout seul, un par un : ramasse ce qui tombe dessus, vide le conteneur au-dessus et alimente ce vers quoi il pointe, comme un coffre ou un distributeur. Alimentez-le en courant pour tout lâcher par le bas d'un coup, sauf si le passage en dessous est bloqué. Il est orienté dans la direction où vous visiez en le posant ; interagissez pour regarder à l'intérieur

